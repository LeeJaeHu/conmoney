name: conmoney
description: "스트레스 없는 월 예산 에이전트 (개인용 Android)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  csv: ^8.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Pretendard-LICENSE.txt
  # Pretendard v1.3.9 (SIL Open Font License 1.1, assets/fonts/Pretendard-LICENSE.txt). 10/16 디자인
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
